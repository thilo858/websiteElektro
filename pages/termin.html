<section class="info">
    <h1>Termin vereinbaren</h1>

    <p>
        Sie haben Fragen oder planen ein Projekt?
        Schreiben Sie uns gerne eine Nachricht.
        Wir melden uns schnellstmöglich bei Ihnen.
    </p>

    <form>
        <label for="name">Ihr Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Ihre E-Mail-Adresse:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefon">Ihre Telefonnummer:</label>
        <input type="tel" id="telefon" name="telefon">

        <label for="datum">Wunschtermin:</label>
        <input type="date" id="datum" name="datum">

        <label for="nachricht">Worum geht es?</label>
        <textarea id="nachricht" name="nachricht" rows="5"></textarea>

        <button type="submit">Terminanfrage senden</button>
    </form>
</section>

<script src="../script.js"></script>

</body>
</html>
